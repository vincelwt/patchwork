name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Set version from release tag
        run: scripts/set-release-version.sh "$GITHUB_REF_NAME"
      - run: npm ci
        working-directory: desktop
      - name: Build bundled CLI
        run: |
          cargo build --release --target aarch64-apple-darwin -p patchwork-cli
          mkdir -p desktop/src-tauri/binaries
          cp target/aarch64-apple-darwin/release/patchwork \
            desktop/src-tauri/binaries/patchwork-aarch64-apple-darwin
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Patchwork ${{ github.ref_name }}
          releaseBody: Desktop and relay binaries for ${{ github.ref_name }}.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json
      - name: Smoke test packaged app and CLI
        run: |
          version=${GITHUB_REF_NAME#v}
          app=target/aarch64-apple-darwin/release/bundle/macos/Patchwork.app
          cli="$app/Contents/MacOS/patchwork"
          test -x "$cli"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          test "$(env -i HOME="$HOME" PATH="$(dirname "$cli"):/usr/bin:/bin:/usr/sbin:/sbin" patchwork --version)" = "patchwork $version"
          codesign --verify --deep --strict "$app"
      - name: Verify desktop update artifacts before publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          archive="Patchwork_${version}_aarch64.app.tar.gz"
          assets="$RUNNER_TEMP/release-assets"
          mkdir "$assets"
          gh release download "$GITHUB_REF_NAME" --dir "$assets" \
            --pattern 'Patchwork_*' --pattern latest.json
          for name in "$archive" "$archive.sig" "Patchwork_${version}_aarch64.dmg"; do
            test -f "$assets/$name"
          done
          for asset in "$assets"/Patchwork_*; do
            case "$(basename "$asset")" in
              Patchwork_"${version}"_*) ;;
              *) echo "::error::Artifact version does not match $GITHUB_REF_NAME: $(basename "$asset")"; exit 1 ;;
            esac
          done
          gh release view "$GITHUB_REF_NAME" --json assets,isDraft > "$assets/release.json"
          archive_url=$(jq -er --arg archive "$archive" '.assets[] | select(.name == $archive) | .apiUrl' "$assets/release.json")
          jq -e '.isDraft' "$assets/release.json"
          jq -e --arg version "$version" --arg archive_url "$archive_url" '
            .version == $version
            and (.platforms | length > 0)
            and all(.platforms[]; .url == $archive_url)
          ' "$assets/latest.json"

  relay:
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Set version from release tag
        run: scripts/set-release-version.sh "$GITHUB_REF_NAME"
      - run: |
          version=${GITHUB_REF_NAME#v}
          cargo build --release -p patchwork-relay -p patchwork-cli
          test "$(target/release/patchwork-relay --version)" = "patchwork-relay $version"
          test "$(target/release/patchwork --version)" = "patchwork $version"
          cp target/release/patchwork-relay patchwork-relay-linux-x86_64
          cp target/release/patchwork patchwork-linux-x86_64
          sha256sum patchwork-relay-linux-x86_64 > patchwork-relay-linux-x86_64.sha256
          sha256sum patchwork-linux-x86_64 > patchwork-linux-x86_64.sha256
          gh release upload "$GITHUB_REF_NAME" \
            patchwork-relay-linux-x86_64 \
            patchwork-relay-linux-x86_64.sha256 \
            patchwork-linux-x86_64 \
            patchwork-linux-x86_64.sha256 \
            --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  testflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: |
          current=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          previous=$(git describe --tags --match 'v*' --abbrev=0 "$current^")
          git diff --quiet "$previous" "$current" -- mobile client && changed=false || changed=true
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - if: steps.changes.outputs.changed == 'true'
        run: npm ci
        working-directory: mobile
      - name: Build, submit, and distribute to Internal Testers
        if: steps.changes.outputs.changed == 'true'
        id: ios
        run: |
          npx --yes eas-cli@21.8.0 build --platform ios --profile production \
            --non-interactive --auto-submit --json > "$RUNNER_TEMP/eas-build.json"
          echo "build_id=$(jq -er '.[0].id' "$RUNNER_TEMP/eas-build.json")" >> "$GITHUB_OUTPUT"
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Verify Internal Testers distribution
        if: steps.changes.outputs.changed == 'true'
        run: |
          npx --yes eas-cli@21.8.0 submit:status --platform ios --json \
            --non-interactive > "$RUNNER_TEMP/testflight-status.json"
          jq -e --arg build_id "${{ steps.ios.outputs.build_id }}" '
            .ios.testFlightBuilds[]
            | select(.easBuildId == $build_id)
            | select(.processingState == "VALID" and .internalState == "IN_BETA_TESTING")
          ' "$RUNNER_TEMP/testflight-status.json" || {
            echo "::error::iOS build ${{ steps.ios.outputs.build_id }} was not distributed to Internal Testers"
            jq '.ios.testFlightBuilds' "$RUNNER_TEMP/testflight-status.json"
            exit 1
          }
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
