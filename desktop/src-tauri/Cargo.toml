[package]
name = "patchwork-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Patchwork Desktop: the collaboration UI and local agent execution"

[lib]
name = "patchwork_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
patchwork-core.workspace = true
patchwork-agent.workspace = true
# Desktop can be the relay: one machine, no second thing to install.
patchwork-relay = { path = "../../crates/patchwork-relay" }

tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
reqwest.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
sha2.workspace = true
base64.workspace = true

# The chord that starts dictation works when Patchwork is not the app you are
# in, which is a system-level hotkey and so is desktop-only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
