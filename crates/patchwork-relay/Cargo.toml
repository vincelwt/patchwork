[package]
name = "patchwork-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Patchwork relay: shared data, realtime collaboration, files, automations and hosted agents"

[[bin]]
name = "patchwork-relay"
path = "src/main.rs"

[dependencies]
patchwork-core.workspace = true
patchwork-agent.workspace = true

anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
uuid.workspace = true
rand.workspace = true
sha2.workspace = true
base64.workspace = true
dirs.workspace = true
regex.workspace = true
which.workspace = true

axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "limit"] }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
mime_guess = "2"
# Real schedules: "every day at 09:00" is a different promise from "every
# 1440 minutes", which drifts to whenever you happened to create it.
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest.workspace = true
