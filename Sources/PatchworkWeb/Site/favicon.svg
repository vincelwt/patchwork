<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Patchwork">
  <!-- Flat monochrome pi glyph, no background: matches the native app icon's mark so the
       browser tab and home-screen icon read as the same product. Uses currentColor so it
       could be recolored via CSS, though the manifest/apple-touch-icon PNGs are the ones
       actually shown on a home screen. -->
